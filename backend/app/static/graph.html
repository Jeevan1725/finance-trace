<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Finance Trace - Fund Flow Graph</title>
<script src="https://unpkg.com/cytoscape@3.29.2/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; }
  #topbar { padding: 16px 24px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; gap: 16px; align-items: center; }
  #topbar h1 { margin: 0; font-size: 18px; font-weight: 600; }
  #topbar input { flex: 1; padding: 8px 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #e2e8f0; font-size: 13px; max-width: 480px; }
  #topbar button { padding: 8px 16px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; }
  #topbar button:hover { background: #2563eb; }
  #cy { width: 100%; height: calc(100vh - 65px); }
  #info { position: fixed; bottom: 16px; right: 16px; background: #1e293b; padding: 12px 16px; border-radius: 8px; font-size: 12px; color: #94a3b8; border: 1px solid #334155; }
  #tooltip { position: fixed; pointer-events: none; background: #0f172a; border: 1px solid #475569; padding: 8px 12px; border-radius: 6px; font-size: 12px; color: #e2e8f0; display: none; z-index: 1000; max-width: 300px; }
</style>
</head>
<body>
<div id="topbar">
  <h1>Fund Flow Graph</h1>
  <input id="caseId" placeholder="Paste Case UUID..." />
  <button onclick="loadGraph()">Load Graph</button>
  <button onclick="cy.fit()" style="background:#475569">Fit</button>
</div>
<div id="cy"></div>
<div id="info">Node = account | Arrow = fund flow | Width = total amount</div>
<div id="tooltip"></div>
<script>
let cy = null;
let currentCaseId = "";

function loadGraph() {
  const caseId = document.getElementById("caseId").value.trim();
  if (!caseId) return alert("Paste a case UUID first");
  currentCaseId = caseId;
  fetch(`/cases/${caseId}/graph`)
    .then(r => r.json())
    .then(data => renderGraph(data))
    .catch(err => alert("Error: " + err));
}

function renderGraph(data) {
  if (!data.nodes.length) {
    alert("No graph data for this case yet");
    return;
  }
  const elements = [];
  data.nodes.forEach(n => {
    elements.push({
      data: { id: n.id, label: n.label, account_type: n.account_type, bank: n.bank }
    });
  });
  data.edges.forEach(e => {
    elements.push({
      data: {
        id: e.id, source: e.source, target: e.target,
        total: e.total, count: e.count,
        width: Math.max(1, Math.min(12, Math.log10(e.total + 1)))
      }
    });
  });

  if (cy) cy.destroy();
  cy = cytoscape({
    container: document.getElementById("cy"),
    elements,
    style: [
      {
        selector: "node",
        style: {
          "background-color": n => n.data("account_type") === "CURRENT" ? "#3b82f6" : "#f59e0b",
          "label": "data(label)", "color": "#fff",
          "text-valign": "center", "text-halign": "center",
          "font-size": 14, "font-weight": 600,
          "width": n => n.data("account_type") === "CURRENT" ? 70 : 55,
          "height": n => n.data("account_type") === "CURRENT" ? 70 : 55,
          "border-width": 3,
          "border-color": n => n.data("account_type") === "CURRENT" ? "#1e40af" : "#b45309"
        }
      },
      {
        selector: "edge",
        style: {
          "width": "data(width)", "line-color": "#64748b",
          "target-arrow-color": "#64748b", "target-arrow-shape": "triangle",
          "curve-style": "bezier", "arrow-scale": 1.5, "opacity": 0.85
        }
      },
      { selector: "edge:hover", style: { "line-color": "#3b82f6", "target-arrow-color": "#3b82f6", "opacity": 1 } }
    ],
    layout: { name: "dagre", rankDir: "LR", nodeSep: 80, rankSep: 120, padding: 40 },
    wheelSensitivity: 0.2
  });

  const tt = document.getElementById("tooltip");
  cy.on("mouseover", "edge", evt => {
    const e = evt.target.data();
    tt.innerHTML = "<strong>Flow</strong><br/>INR " + e.total.toLocaleString("en-IN") + "<br/><span style='color:#94a3b8'>" + e.count + " transaction(s)</span>";
    tt.style.display = "block";
  });
  cy.on("mousemove", "edge", evt => { tt.style.left = evt.originalEvent.pageX + 12 + "px"; tt.style.top = evt.originalEvent.pageY + 12 + "px"; });
  cy.on("mouseout", "edge", () => { tt.style.display = "none"; });
  cy.on("mouseover", "node", evt => {
    const n = evt.target.data();
    tt.innerHTML = "<strong>Account " + n.label + "</strong><br/>Type: " + n.account_type + "<br/>Bank: " + n.bank;
    tt.style.display = "block";
  });
  cy.on("mousemove", "node", evt => { tt.style.left = evt.originalEvent.pageX + 12 + "px"; tt.style.top = evt.originalEvent.pageY + 12 + "px"; });
  cy.on("mouseout", "node", () => { tt.style.display = "none"; });
}

const params = new URLSearchParams(window.location.search);
if (params.get("case")) {
  document.getElementById("caseId").value = params.get("case");
  loadGraph();
}
</script>
</body>
</html>
