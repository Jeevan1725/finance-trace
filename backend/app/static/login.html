<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Finance Trace</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center font-sans">

<div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-md">
  <div class="text-center mb-8">
    <h1 class="text-3xl font-bold text-slate-800 tracking-tight">💰 Finance Trace</h1>
    <p class="text-slate-500 text-sm mt-2">Sign in to your forensic workspace</p>
  </div>

  <div id="error-msg" class="hidden bg-red-50 text-red-600 p-3 rounded text-sm mb-4 border border-red-200"></div>

  <form id="login-form" onsubmit="event.preventDefault(); doLogin();">
    <div class="mb-4">
      <label class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
      <input type="email" id="email" required class="w-full border p-2.5 rounded focus:ring-2 focus:ring-blue-500 outline-none">
    </div>
    <div class="mb-6">
      <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
      <input type="password" id="password" required class="w-full border p-2.5 rounded focus:ring-2 focus:ring-blue-500 outline-none">
    </div>
    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded transition">Sign In</button>
  </form>
  
  <div class="mt-6 text-center text-sm text-slate-500">
    First time? <a href="#" onclick="doRegister()" class="text-blue-600 hover:underline">Create Admin Account</a>
  </div>
</div>

<script>
async function doLogin() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const err = document.getElementById('error-msg');
  
  err.classList.add('hidden');

  const formData = new URLSearchParams();
  formData.append('username', email); // OAuth2 expects 'username'
  formData.append('password', password);

  try {
    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: formData
    });

    if (res.ok) {
      const data = await res.json();
      localStorage.setItem('token', data.access_token);
      localStorage.setItem('user_name', data.full_name);
      window.location.href = '/dashboard';
    } else {
      const data = await res.json();
      err.innerText = data.detail || "Login failed";
      err.classList.remove('hidden');
    }
  } catch (e) {
    err.innerText = "Network error";
    err.classList.remove('hidden');
  }
}

async function doRegister() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  if(!email || !password) return alert("Enter email and password to register");
  
  const res = await fetch('/auth/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email, password: password, full_name: email.split('@')[0] })
  });
  
  if (res.ok) {
    alert("Account created! You can now login.");
  } else {
    const data = await res.json();
    alert("Error: " + data.detail);
  }
}
</script>
</body>
</html>
